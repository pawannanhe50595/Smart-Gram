<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmartGram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        :root {
            --primary-color: #2e7d32;
            --primary-dark: #1b5e20;
            --secondary-color: #ff9800;
            --accent-color: #2196f3;
            --bg-light: #f8f9fa;
            --text-dark: #333;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            min-height: 100vh;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 280px;
            background: #1a2a1a;
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 3rem;
        }

        .nav-items {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 1rem;
        }

        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            margin-left: 280px;
            flex-grow: 1;
            padding: 2rem 3rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* ==================== DATA TABLE ==================== */
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            border-bottom: 2px solid #eee;
            color: #666;
            font-size: 0.9rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-good {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-warning {
            background: #fff3e0;
            color: #ef6c00;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.4rem;
            border: none;
            background: none;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--primary-color);
        }

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 2rem;
            width: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-globe"></i>
            <span>SmartGram Admin</span>
        </div>
        <ul class="nav-items">
            <li class="nav-item">
                <a href="#" class="nav-link active"><i class="fas fa-city"></i> Manage Villages</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="fas fa-users"></i> Users</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <a href="dashboard" class="nav-link"><i class="fas fa-arrow-left"></i> Exit to App</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Village Management</h1>
                <p style="color: #666;">Create and update village developmental data.</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> Add New Village
            </button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Village ID</th>
                        <th>Name</th>
                        <th>Region</th>
                        <th>Population</th>
                        <th>Water Access</th>
                        <th>Last Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="villageTableBody">
                    <!-- Data will be loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="villageModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Village</h2>
            <form id="villageForm" style="margin-top: 1.5rem;">
                <input type="hidden" id="village_id">
                <div class="form-group">
                    <label>Village Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="e.g., Riverside">
                </div>
                <div class="form-group">
                    <label>Region</label>
                    <select id="region" class="form-control">
                        <option>North</option>
                        <option>South</option>
                        <option>East</option>
                        <option>West</option>
                        <option>Central</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Population</label>
                        <input type="number" id="population" class="form-control">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Water Access (%)</label>
                        <input type="number" id="water_access" class="form-control" min="0" max="100">
                    </div>
                </div>
                <div class="actions" style="margin-top: 2rem; justify-content: flex-end;">
                    <button type="button" class="btn" style="background: #eee;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Village</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function fetchVillages() {
            const response = await fetch('/api/villages');
            const result = await response.json();
            const tableBody = document.getElementById('villageTableBody');
            tableBody.innerHTML = '';

            result.data.forEach(v => {
                const waterClass = v.water_access_pct >= 80 ? 'status-good' : 'status-warning';
                tableBody.innerHTML += `
                    <tr>
                        <td>#${v.id}</td>
                        <td style="font-weight: bold;">${v.name}</td>
                        <td>${v.region}</td>
                        <td>${v.population.toLocaleString()}</td>
                        <td><span class="status-badge ${waterClass}">${v.water_access_pct}%</span></td>
                        <td>${v.last_updated}</td>
                        <td class="actions">
                            <button class="action-btn" onclick="editVillage(${v.id})"><i class="fas fa-edit"></i></button>
                            <button class="action-btn" style="color: #f44336;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('villageModal').style.display = 'block';
            document.getElementById('modalTitle').innerText = 'Add New Village';
            document.getElementById('villageForm').reset();
        }

        function closeModal() {
            document.getElementById('villageModal').style.display = 'none';
        }

        async function editVillage(id) {
            const response = await fetch(`/api/village/${id}`);
            const result = await response.json();
            const v = result.data;

            document.getElementById('village_id').value = v.id;
            document.getElementById('name').value = v.name;
            document.getElementById('region').value = v.region;
            document.getElementById('population').value = v.population;
            document.getElementById('water_access').value = v.water_access_pct;

            document.getElementById('modalTitle').innerText = 'Edit Village Details';
            document.getElementById('villageModal').style.display = 'block';
        }

        document.getElementById('villageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('village_id').value;
            const data = {
                name: document.getElementById('name').value,
                region: document.getElementById('region').value,
                population: parseInt(document.getElementById('population').value),
                water_access_pct: parseInt(document.getElementById('water_access').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/village/${id}` : '/api/village';

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeModal();
            fetchVillages();
        });

        window.onload = fetchVillages;
    </script>
    <script type="module" src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
